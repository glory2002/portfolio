<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: monospace;
            background: #1a1a1a;
            color: #00ff00;
            overflow: hidden;
        }
        h1, p {
            text-align: center;
        }
        #rabbit {
            position: fixed;
            bottom: 50px;
            left: -100px;
            font-family: monospace;
            white-space: pre;
            line-height: 1.2;
            font-size: 14px;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <h1>Welcome to My Portfolio</h1>
    <p>Under construction - Coming soon! gloria</p>
    <p>🚀 Portfolio site is live and connected to GitHub!</p>
    
    <div id="rabbit"></div>

    <script>
        const rabbitFrames = [
            // Frame 1 - Standing
            `   (\\___/)
   (o . o)
   (> ^ <)
   /|   |\\
  (_|   |_)`,
            // Frame 2 - Running 1
            `   (\\___/)
   (o . o)
   (> ^ <)
    |\\  /|
   (_)  (_)`,
            // Frame 3 - Jumping
            `   (\\___/)
   (^ w ^)
   (> ^ <)
    /   \\
   /     \\`,
            // Frame 4 - Running 2
            `   (\\___/)
   (o . o)
   (> ^ <)
   /|  |\\
  (_)  (_)`,
            // Frame 5 - Mid-air
            `   (\\___/)
   (o o o)
   (> v <)
    \\   /
     \\ /`
        ];

        let position = -150;
        let frameIndex = 0;
        let time = 0;
        const rabbitEl = document.getElementById('rabbit');
        const speed = 4;

        function animate() {
            time += 0.1;
            
            // Move rabbit horizontally
            position += speed;
            
            // Loop back when off screen
            if (position > window.innerWidth + 100) {
                position = -150;
                time = 0;
            }
            
            // Calculate jump height with smoother curve
            let jumpHeight = 0;
            const jumpCycle = (position % 300) / 300;
            
            if (jumpCycle < 0.5) {
                // Going up
                jumpHeight = Math.sin(jumpCycle * Math.PI * 2) * 60;
            }
            
            // Select frame based on jump height
            if (jumpHeight > 40) {
                frameIndex = 2; // Peak jump
            } else if (jumpHeight > 20) {
                frameIndex = 4; // Mid-air
            } else if (jumpHeight > 5) {
                frameIndex = 1; // Taking off
            } else {
                // Running on ground
                frameIndex = Math.floor((position / 15) % 2) === 0 ? 1 : 3;
            }
            
            // Apply position and animation
            rabbitEl.style.left = position + 'px';
            rabbitEl.style.bottom = (50 + Math.max(0, jumpHeight)) + 'px';
            rabbitEl.textContent = rabbitFrames[frameIndex];
            
            requestAnimationFrame(animate);
        }

        // Start animation
        animate();
    </script>
</body>
</html>
