<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protected Project | Gloria Angelova</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="shortcut icon" href="assets/favicon.svg">
    <link rel="apple-touch-icon" href="assets/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=12.3">

    <style>
        /* ── Kenya Hara lock page ── */
        .lock-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .lock-main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fafaf9;
            padding: 56px 40px 80px;
        }

        .lock-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 340px;
            text-align: center;
        }

        .lock-icon-wrap {
            margin-bottom: 36px;
        }

        .lock-icon {
            width: 28px;
            height: 28px;
            color: rgba(14, 14, 14, 0.28);
        }

        .lock-eyebrow {
            font-family: var(--font-body);
            font-size: 10px;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.22em;
            color: rgba(14, 14, 14, 0.38);
            margin: 0 0 18px;
        }

        .lock-title {
            font-family: var(--font-heading);
            font-size: clamp(22px, 3vw, 28px);
            font-weight: 300;
            color: #0e0e0e;
            line-height: 1.25;
            letter-spacing: -0.01em;
            margin: 0 0 14px;
        }

        .lock-subtitle {
            font-family: var(--font-body);
            font-size: 13px;
            font-weight: 300;
            color: rgba(14, 14, 14, 0.42);
            line-height: 1.65;
            margin: 0;
        }

        .lock-form {
            width: 100%;
            margin-top: 44px;
        }

        .lock-fields {
            display: flex;
            flex-direction: column;
            gap: 0;
            width: 100%;
        }

        /* Underline input — no box, no radius */
        .lock-input {
            width: 100%;
            padding: 12px 0;
            border: none;
            border-bottom: 1px solid rgba(14, 14, 14, 0.18);
            border-radius: 0;
            font-family: var(--font-body);
            font-size: 14px;
            font-weight: 300;
            color: #0e0e0e;
            background: transparent;
            outline: none;
            transition: border-color 0.25s ease;
            box-sizing: border-box;
            text-align: center;
            letter-spacing: 0.06em;
        }

        .lock-input::placeholder {
            font-size: 10px;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: rgba(14, 14, 14, 0.28);
        }

        .lock-input:focus {
            border-color: rgba(14, 14, 14, 0.55);
        }

        .lock-input.error {
            border-color: rgba(190, 30, 50, 0.45);
        }

        .lock-submit-btn {
            width: 100%;
            margin-top: 28px;
            padding: 15px 24px;
            background: #0e0e0e;
            color: rgba(255, 255, 255, 0.88);
            border: none;
            border-radius: 0;
            font-family: var(--font-body);
            font-size: 10px;
            font-weight: 400;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            cursor: pointer;
            transition: opacity 0.3s ease;
            display: block;
        }

        .lock-submit-btn:hover {
            opacity: 0.68;
            transform: none;
            box-shadow: none;
        }

        .lock-error {
            font-family: var(--font-body);
            font-size: 11px;
            font-weight: 300;
            letter-spacing: 0.05em;
            color: rgba(190, 30, 50, 0.65);
            display: none;
            margin: 18px 0 0;
            width: 100%;
            text-align: center;
        }

        .lock-error.visible {
            display: block;
        }

        .lock-back {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            font-family: var(--font-body);
            font-size: 10px;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            color: rgba(14, 14, 14, 0.32);
            margin-top: 52px;
            text-decoration: none;
            transition: color 0.3s ease, gap 0.2s ease;
        }

        .lock-back:hover {
            color: rgba(14, 14, 14, 0.6);
            gap: 11px;
        }

        .lock-back svg {
            width: 13px;
            height: 13px;
            flex-shrink: 0;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%       { transform: translateX(-6px); }
            40%       { transform: translateX(6px); }
            60%       { transform: translateX(-4px); }
            80%       { transform: translateX(4px); }
        }

        .lock-form.shake {
            animation: shake 0.38s ease;
        }

        @media (max-width: 768px) {
            .lock-main {
                padding: 40px 32px 64px;
            }
        }
    </style>
</head>
<body class="lock-page">
    <!-- Preloader -->
    <div id="preloader">
        <svg class="preloader-icon" viewBox="0 0 42 45" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M41.5574 30.7311L30.327 11.2799C29.9972 10.7109 29.4901 10.2451 28.8676 10.0348C27.6349 9.62665 26.3609 10.1544 25.7549 11.2057L17.3156 25.825C16.9858 26.3939 16.8374 27.0659 16.9693 27.7091C17.2331 28.9789 18.3257 29.8199 19.5378 29.8199H30.2034L27.1814 24.5882H24.0646L28.0142 17.7444L36.371 32.2235C32.9697 37.1007 27.3174 39.8712 21.2982 39.5332C9.8534 38.3705 4.98442 29.8158 5.23591 21.8383C5.4874 13.869 10.8882 5.64406 22.3866 5.22766H26.8351L23.7718 0H22.2011C7.4086 0.535959 0.329821 11.6097 0.0123683 21.6734C-0.305084 31.7576 6.07695 43.2808 20.8406 44.7443C20.8735 44.7443 20.9107 44.7526 20.9436 44.7526C21.3971 44.7814 21.8506 44.7938 22.3 44.7938C30.2034 44.7938 37.4594 40.6999 41.5368 33.8726C42.114 32.9079 42.1223 31.704 41.5574 30.7311Z" fill="#7b61ff"/>
        </svg>
    </div>

    <!-- Header -->
    <header class="header" id="main-header">
        <div class="header-content">
            <div class="logo-container">
                <a href="index.html" class="logo-link">
                    <img src="assets/ga-logo.svg" alt="Gloria Logo" class="logo">
                </a>
            </div>
            <button class="menu-toggle" aria-label="Toggle menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <nav class="nav">
                <a href="index.html#projects" class="nav-link active">Work</a>
                <a href="about.html" class="nav-link">About</a>
                <a href="index.html#contact" class="nav-link">Contact</a>
            </nav>
        </div>
    </header>

    <main class="lock-main">
        <div class="lock-wrap">
            <div class="lock-icon-wrap" aria-hidden="true">
                <svg class="lock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="1"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
            </div>

            <p class="lock-eyebrow">Protected case study</p>
            <h1 class="lock-title">This content<br>is protected.</h1>
            <p class="lock-subtitle">Enter the password you were given<br>to open this project.</p>

            <form class="lock-form" id="lockForm" onsubmit="checkPassword(event)">
                <div class="lock-fields">
                    <input
                        class="lock-input"
                        id="passwordInput"
                        type="password"
                        placeholder="Password"
                        autocomplete="current-password"
                        autofocus
                        aria-invalid="false"
                        aria-describedby="lockError"
                    >
                    <button type="submit" class="lock-submit-btn">Continue</button>
                </div>
                <p class="lock-error" id="lockError" role="alert">Incorrect password. Try again.</p>
            </form>

            <a href="index.html#projects" class="lock-back">
                <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 9H4M9 4L4 9l5 5"/>
                </svg>
                Back to projects
            </a>
        </div>
    </main>

    <script>
        // Mobile menu
        const menuToggle = document.querySelector('.menu-toggle');
        const nav = document.querySelector('.nav');
        if (menuToggle && nav) {
            menuToggle.addEventListener('click', (e) => {
                e.stopPropagation();
                e.preventDefault();
                menuToggle.classList.toggle('active');
                nav.classList.toggle('active');
                document.body.classList.toggle('no-scroll');
            });
            document.querySelectorAll('.nav-link').forEach(link => {
                link.addEventListener('click', () => {
                    menuToggle.classList.remove('active');
                    nav.classList.remove('active');
                    document.body.classList.remove('no-scroll');
                });
            });
            document.addEventListener('click', (e) => {
                if (nav.classList.contains('active') &&
                    !nav.contains(e.target) &&
                    !menuToggle.contains(e.target)) {
                    menuToggle.classList.remove('active');
                    nav.classList.remove('active');
                    document.body.classList.remove('no-scroll');
                }
            });
        }

        // Sticky header
        const header = document.querySelector('.header');
        window.addEventListener('scroll', () => {
            header.classList.toggle('scrolled', window.scrollY > 10);
        });

        // Password check
        // Change the password below to whatever you'd like
        const PASSWORD = 'gloria2024';

        function checkPassword(e) {
            e.preventDefault();
            const input = document.getElementById('passwordInput');
            const form  = document.getElementById('lockForm');
            const error = document.getElementById('lockError');

            if (input.value === PASSWORD) {
                input.setAttribute('aria-invalid', 'false');
                error.classList.remove('visible');
                window.location.href = 'project-insurance.html';
            } else {
                input.classList.add('error');
                input.setAttribute('aria-invalid', 'true');
                error.classList.add('visible');
                form.classList.remove('shake');
                void form.offsetWidth;
                form.classList.add('shake');

                input.value = '';
                input.focus();

                setTimeout(() => {
                    input.classList.remove('error');
                }, 2000);
            }
        }

        document.getElementById('passwordInput').addEventListener('input', function () {
            this.setAttribute('aria-invalid', 'false');
            document.getElementById('lockError').classList.remove('visible');
        });

        // Hide preloader on page load
        document.addEventListener('DOMContentLoaded', function() {
            const preloader = document.getElementById('preloader');
            if (preloader) {
                preloader.classList.add('hidden');
                setTimeout(function() { preloader.remove(); }, 600);
            }
        });
    </script>
</body>
</html>
