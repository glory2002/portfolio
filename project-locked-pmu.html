<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protected Project | Gloria Angelova</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="shortcut icon" href="assets/favicon.svg">
    <link rel="apple-touch-icon" href="assets/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=6.5">

    <style>
        .lock-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .lock-main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 56px 80px 80px;
            background: linear-gradient(165deg, var(--soft-lavender) 0%, var(--white) 42%, var(--bg-gray) 100%);
        }

        .lock-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 480px;
        }

        .lock-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            width: 100%;
            text-align: center;
            padding: 48px 40px 44px;
            background: var(--white);
            border: 1px dashed rgba(0, 0, 0, 0.12);
            border-radius: var(--border-radius-large);
            box-shadow: 0 24px 60px rgba(10, 10, 12, 0.06);
        }

        .lock-icon-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 72px;
            height: 72px;
            border-radius: var(--border-radius-large);
            background: var(--soft-lavender);
            border: 1px dashed rgba(123, 97, 255, 0.25);
            margin-bottom: 4px;
        }

        .lock-icon {
            width: 36px;
            height: 36px;
            color: var(--deep-lavender);
        }

        .lock-eyebrow {
            font-family: var(--font-body);
            font-size: 13px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--deep-lavender);
            margin: 0;
        }

        .lock-title {
            font-family: var(--font-heading);
            font-size: clamp(28px, 4vw, 36px);
            font-weight: 500;
            color: var(--text-color);
            line-height: 1.2;
            margin: 0;
            max-width: 22ch;
        }

        .lock-subtitle {
            font-family: var(--font-body);
            font-size: 16px;
            font-weight: 300;
            color: rgba(10, 10, 12, 0.55);
            line-height: 1.5;
            margin: 0;
            max-width: 32ch;
        }

        .lock-form {
            width: 100%;
            margin-top: 12px;
        }

        .lock-fields {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
        }

        .lock-input {
            width: 100%;
            padding: 16px 18px;
            border: 1.5px solid rgba(10, 10, 12, 0.12);
            border-radius: var(--border-radius-medium);
            font-family: var(--font-body);
            font-size: 16px;
            color: var(--text-color);
            background: var(--white);
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            box-sizing: border-box;
        }

        .lock-input::placeholder {
            color: rgba(10, 10, 12, 0.35);
        }

        .lock-input:focus {
            border-color: var(--deep-lavender);
            box-shadow: 0 0 0 3px rgba(123, 97, 255, 0.12);
        }

        .lock-input.error {
            border-color: #e11d48;
            box-shadow: 0 0 0 3px rgba(225, 29, 72, 0.1);
        }

        .lock-submit-btn {
            width: 100%;
            margin-top: 2px;
        }

        .lock-error {
            font-family: var(--font-body);
            font-size: 14px;
            font-weight: 500;
            color: #e11d48;
            display: none;
            margin: 4px 0 0;
            width: 100%;
            text-align: center;
        }

        .lock-error.visible {
            display: block;
        }

        .lock-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font-body);
            font-size: 18px;
            font-weight: 500;
            color: var(--deep-lavender);
            margin-top: 28px;
            transition: gap 0.2s ease;
        }

        .lock-back:hover {
            gap: 14px;
        }

        .lock-back svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%       { transform: translateX(-8px); }
            40%       { transform: translateX(8px); }
            60%       { transform: translateX(-5px); }
            80%       { transform: translateX(5px); }
        }

        .lock-form.shake {
            animation: shake 0.4s ease;
        }

        @media (max-width: 768px) {
            .lock-main {
                padding: 40px 24px 56px;
            }

            .lock-card {
                padding: 36px 24px 32px;
            }
        }
    </style>
</head>
<body class="lock-page">
    <!-- Preloader -->
    <div id="preloader">
        <svg class="preloader-icon" viewBox="0 0 42 45" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M41.5574 30.7311L30.327 11.2799C29.9972 10.7109 29.4901 10.2451 28.8676 10.0348C27.6349 9.62665 26.3609 10.1544 25.7549 11.2057L17.3156 25.825C16.9858 26.3939 16.8374 27.0659 16.9693 27.7091C17.2331 28.9789 18.3257 29.8199 19.5378 29.8199H30.2034L27.1814 24.5882H24.0646L28.0142 17.7444L36.371 32.2235C32.9697 37.1007 27.3174 39.8712 21.2982 39.5332C9.8534 38.3705 4.98442 29.8158 5.23591 21.8383C5.4874 13.869 10.8882 5.64406 22.3866 5.22766H26.8351L23.7718 0H22.2011C7.4086 0.535959 0.329821 11.6097 0.0123683 21.6734C-0.305084 31.7576 6.07695 43.2808 20.8406 44.7443C20.8735 44.7443 20.9107 44.7526 20.9436 44.7526C21.3971 44.7814 21.8506 44.7938 22.3 44.7938C30.2034 44.7938 37.4594 40.6999 41.5368 33.8726C42.114 32.9079 42.1223 31.704 41.5574 30.7311Z" fill="#7b61ff"/>
        </svg>
    </div>

    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="logo-container">
                <a href="index.html" class="logo-link">
                    <img src="assets/ga-logo.svg" alt="Gloria Logo" class="logo">
                    <span class="logo-greeting" aria-hidden="true">← I made this.</span>
                </a>
            </div>
            <button class="menu-toggle" aria-label="Toggle menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <nav class="nav">

                <a href="about.html" class="nav-link">About</a>
                <a href="index.html#projects" class="nav-link active">Projects</a>
                <a href="index.html#contact" class="nav-link">Contact</a>
            </nav>
        </div>
    </header>

    <main class="lock-main">
        <div class="lock-wrap">
            <div class="lock-card">
                <div class="lock-icon-wrap" aria-hidden="true">
                    <svg class="lock-icon" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="12" y="28" width="40" height="28" rx="6"/>
                        <path d="M20 28v-8a12 12 0 0 1 24 0v8"/>
                        <circle cx="32" cy="44" r="3" fill="currentColor" stroke="none"/>
                        <line x1="32" y1="47" x2="32" y2="52"/>
                    </svg>
                </div>

                <p class="lock-eyebrow">Protected case study</p>
                <h1 class="lock-title">This content is protected.</h1>
                <p class="lock-subtitle">Enter the password you were given to open this project.</p>

                <form class="lock-form" id="lockForm" onsubmit="checkPassword(event)">
                    <div class="lock-fields">
                        <input
                            class="lock-input"
                            id="passwordInput"
                            type="password"
                            placeholder="Password"
                            autocomplete="current-password"
                            autofocus
                            aria-invalid="false"
                            aria-describedby="lockError"
                        >
                        <button type="submit" class="btn btn-primary-gradient lock-submit-btn">Continue</button>
                    </div>
                </form>

                <p class="lock-error" id="lockError" role="alert">Incorrect password. Please try again.</p>
            </div>

            <a href="index.html#projects" class="lock-back">
                <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 9H4M9 4L4 9l5 5"/>
                </svg>
                Back to projects
            </a>
        </div>
    </main>

    <script>
        // Mobile menu
        const menuToggle = document.querySelector('.menu-toggle');
        const nav = document.querySelector('.nav');
        if (menuToggle && nav) {
            menuToggle.addEventListener('click', (e) => {
                e.stopPropagation();
                e.preventDefault();
                menuToggle.classList.toggle('active');
                nav.classList.toggle('active');
                document.body.classList.toggle('no-scroll');
            });
            document.querySelectorAll('.nav-link').forEach(link => {
                link.addEventListener('click', () => {
                    menuToggle.classList.remove('active');
                    nav.classList.remove('active');
                    document.body.classList.remove('no-scroll');
                });
            });
            document.addEventListener('click', (e) => {
                if (nav.classList.contains('active') &&
                    !nav.contains(e.target) &&
                    !menuToggle.contains(e.target)) {
                    menuToggle.classList.remove('active');
                    nav.classList.remove('active');
                    document.body.classList.remove('no-scroll');
                }
            });
        }

        // Sticky header
        const header = document.querySelector('.header');
        window.addEventListener('scroll', () => {
            header.classList.toggle('scrolled', window.scrollY > 10);
        });

        // Password check
        // Change the password below to whatever you'd like
        const PASSWORD = 'gloria2024';

        function checkPassword(e) {
            e.preventDefault();
            const input = document.getElementById('passwordInput');
            const form  = document.getElementById('lockForm');
            const error = document.getElementById('lockError');

            if (input.value === PASSWORD) {
                input.setAttribute('aria-invalid', 'false');
                error.classList.remove('visible');
                window.location.href = 'project-pmu.html';
            } else {
                input.classList.add('error');
                input.setAttribute('aria-invalid', 'true');
                error.classList.add('visible');
                form.classList.remove('shake');
                void form.offsetWidth;
                form.classList.add('shake');

                input.value = '';
                input.focus();

                setTimeout(() => {
                    input.classList.remove('error');
                }, 2000);
            }
        }

        document.getElementById('passwordInput').addEventListener('input', function () {
            this.setAttribute('aria-invalid', 'false');
            document.getElementById('lockError').classList.remove('visible');
        });

        // Hide preloader on page load
        document.addEventListener('DOMContentLoaded', function() {
            const preloader = document.getElementById('preloader');
            if (preloader) {
                preloader.classList.add('hidden');
                setTimeout(function() { preloader.remove(); }, 600);
            }
        });
    </script>
</body>
</html>
